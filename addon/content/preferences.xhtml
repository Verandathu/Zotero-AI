<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox>
  <label><html:h2 data-l10n-id="pref-title"></html:h2></label>
  <checkbox
    id="zotero-prefpane-__addonRef__-enable"
    preference="enable"
    data-l10n-id="pref-enable"
  />
</groupbox>
<groupbox>
  <label><html:h2 data-l10n-id="pref-api-header"></html:h2></label>
  <hbox align="center">
    <html:label
      style="width: 12em"
      for="zotero-prefpane-__addonRef__-baseURL"
      data-l10n-id="pref-baseurl"
    ></html:label>
    <html:input
      type="text"
      id="zotero-prefpane-__addonRef__-baseURL"
      preference="baseURL"
      flex="1"
    ></html:input>
  </hbox>
  <hbox align="center">
    <html:label
      style="width: 12em"
      for="zotero-prefpane-__addonRef__-apiKey"
      data-l10n-id="pref-apikey"
    ></html:label>
    <html:input
      type="password"
      id="zotero-prefpane-__addonRef__-apiKey"
      preference="apiKey"
      flex="1"
    ></html:input>
  </hbox>
  <hbox align="center">
    <html:label
      style="width: 12em"
      for="zotero-prefpane-__addonRef__-model"
      data-l10n-id="pref-model"
    ></html:label>
    <html:input
      type="text"
      id="zotero-prefpane-__addonRef__-model"
      preference="model"
      flex="1"
    ></html:input>
  </hbox>
  <hbox align="center">
    <html:label
      style="width: 12em"
      for="zotero-prefpane-__addonRef__-temperature"
      data-l10n-id="pref-temperature"
    ></html:label>
    <html:input
      type="number"
      step="0.1"
      min="0"
      max="2"
      id="zotero-prefpane-__addonRef__-temperature"
      preference="temperature"
    ></html:input>
  </hbox>
  <hbox align="center">
    <html:label
      style="width: 12em"
      for="zotero-prefpane-__addonRef__-maxTokens"
      data-l10n-id="pref-maxtokens"
    ></html:label>
    <html:input
      type="number"
      step="100"
      min="0"
      id="zotero-prefpane-__addonRef__-maxTokens"
      preference="maxTokens"
    ></html:input>
  </hbox>
</groupbox>
<groupbox>
  <label><html:h2 data-l10n-id="pref-context-header"></html:h2></label>
  <checkbox
    id="zotero-prefpane-__addonRef__-includeFullText"
    preference="includeFullText"
    data-l10n-id="pref-includefulltext"
  />
  <hbox align="center">
    <html:label
      style="width: 12em"
      for="zotero-prefpane-__addonRef__-fullTextLimit"
      data-l10n-id="pref-fulltextlimit"
    ></html:label>
    <html:input
      type="number"
      step="1000"
      min="0"
      id="zotero-prefpane-__addonRef__-fullTextLimit"
      preference="fullTextLimit"
    ></html:input>
  </hbox>
  <hbox align="center">
    <html:label
      style="width: 12em"
      for="zotero-prefpane-__addonRef__-contextWindowTokens"
      data-l10n-id="pref-contextwindow"
    ></html:label>
    <html:input
      type="number"
      step="1000"
      min="1000"
      id="zotero-prefpane-__addonRef__-contextWindowTokens"
      preference="contextWindowTokens"
    ></html:input>
  </hbox>
  <html:label
    for="zotero-prefpane-__addonRef__-systemPrompt"
    data-l10n-id="pref-systemprompt"
  ></html:label>
  <html:textarea
    id="zotero-prefpane-__addonRef__-systemPrompt"
    preference="systemPrompt"
    rows="3"
  ></html:textarea>
  <html:label
    for="zotero-prefpane-__addonRef__-quickPrompts"
    data-l10n-id="pref-quickprompts"
  ></html:label>
  <html:textarea
    id="zotero-prefpane-__addonRef__-quickPrompts"
    preference="quickPrompts"
    rows="4"
  ></html:textarea>
</groupbox>
<groupbox>
  <label><html:h2 data-l10n-id="pref-agentic-header"></html:h2></label>
  <checkbox
    id="zotero-prefpane-__addonRef__-agenticResearch"
    preference="agenticResearch"
    data-l10n-id="pref-agenticresearch"
  />
  <hbox align="center">
    <html:label
      style="width: 12em"
      for="zotero-prefpane-__addonRef__-agenticMaxWorks"
      data-l10n-id="pref-agenticmaxworks"
    ></html:label>
    <html:input
      type="number"
      step="1"
      min="1"
      max="20"
      id="zotero-prefpane-__addonRef__-agenticMaxWorks"
      preference="agenticMaxWorks"
    ></html:input>
  </hbox>
</groupbox>
<vbox>
  <html:label
    data-l10n-id="pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
  ></html:label>
</vbox>
